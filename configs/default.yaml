# Single source of truth for every analysis parameter.
# Change values here, never hard-code them in notebooks or modules.
# Each value marked "sensitivity" will be varied in the sensitivity analysis.

seed: 42

paths:
  raw: data/raw
  interim: data/interim        # cleaned, per-match parquet files
  processed: data/processed    # analysis-ready tables (metrics, turnovers)
  figures: reports/figures
  tables: reports/tables

pitch:
  length_m: 105.0   # Metrica README
  width_m: 68.0

tracking:
  fps: 25                     # verified in docs/01_dataset_audit.md
  smoothing_window_s: 0.28    # sensitivity: Savitzky-Golay window for velocities (7 frames)
  smoothing_polyorder: 2
  max_speed_ms: 12.0          # raw frame-to-frame speeds above this fail QC

# Ball in play = event data says play is live AND the ball is tracked.
# Neither signal alone is reliable (see docs/01_dataset_audit.md section 8).
ball_in_play:
  max_ball_gap_s: 1.0         # sensitivity: shorter ball gaps are interpolated
  stop_types: ["BALL OUT", "FAULT RECEIVED"]
  stop_shot_subtypes: ["OUT", "GOAL"]   # SHOT events whose subtype contains these
  restart_types: ["SET PIECE"]
  restart_subtypes: ["GOAL KICK"]       # goal kicks are coded as PASS / BALL LOST

datasets:
  metrica:
    games: [1, 2, 3]

possession:
  turnover_event_types: ["BALL LOST", "RECOVERY"]
  min_gap_between_turnovers_s: 3.0   # sensitivity
  min_possession_length_s: 2.0       # sensitivity

metrics:
  exclude_goalkeeper: true   # sensitivity

timecourse:
  window_before_s: 5.0
  window_after_s: 10.0
  n_control_samples_per_turnover: 5
  n_bootstrap: 2000
